name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck (app)
        run: bun run typecheck
      - name: Typecheck (e2e harness)
        run: bun run typecheck:e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # oxlint finishes in well under a second; anything past 10 minutes is a
    # hung install or runner, not a slow lint.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fails the build on any error, and on more warnings than the baseline
      # recorded in the "lint" script. Both numbers only ever go down — see the
      # ratchet note at the top of .oxlintrc.json.
      - name: Lint (oxlint)
        run: bun run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    # The suite runs in ~100ms; anything past 10 minutes is a hung install or
    # runner, not a slow test run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # These cover what the e2e suite structurally CANNOT reach, which is the
      # reason they are their own gate rather than a faster corner of that one.
      # Every fixture value reaching a table cell in e2e is ASCII, and ASCII is
      # exactly the input class for which a correct and an incorrect column
      # measure agree — so a green e2e run proves nothing about the width logic.
      # Same for torn-transcript recovery (the screen draws a recovered record
      # no differently from any other) and for the rule that the TUI's rescan
      # timer must never pull in src/gitrefs.ts, which has no rendered output to
      # assert on at all.
      - name: Unit tests
        run: bun run test

  e2e:
    name: E2E + CRAP score
    runs-on: ubuntu-latest
    # One instrumented run, gating two things. `bun run crap` runs the unit
    # suite and then the e2e suite with src/ instrumented for coverage, and
    # fails if either suite fails OR if any function in src/ scores above its
    # pin in .craprc.jsonc (see scripts/crap/).
    #
    # This used to be two jobs: a plain `test:e2e` run and a CRAP run that
    # executed the very same specs a second time in parallel. That bought no
    # signal — the instrumented run already fails on any spec failure — and cost
    # a second chance to hit the keystroke-timing flake, so a flaky PR went red
    # twice as often for the same reason. The plain copy was the one deleted
    # because it is the one whose result the instrumented run subsumes.
    #
    # Instrumentation roughly doubles the e2e wall clock; past 30 minutes it is
    # stuck, not slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Playwright's test runner and node-pty's native addon run under Node; the
      # app-under-test and the wterm WASM bundle step run under bun. Both needed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium + OS deps
        run: bunx playwright install --with-deps chromium
      # CI is set automatically by GitHub → the Playwright config enables
      # forbidOnly, 2 workers, and 2 retries for the known keystroke-timing
      # flake. The CRAP pins are the same one-directional ratchet as
      # .oxlintrc.json: lowered in the PR that makes a lower value hold, never
      # raised.
      - name: E2E suite under coverage, then CRAP score
        run: bun run crap
      - name: Upload e2e artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/.artifacts
            e2e/screenshots
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload CRAP report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: crap-report
          path: coverage/crap/report.json
          if-no-files-found: ignore
          retention-days: 7
